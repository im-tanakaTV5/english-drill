<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1f4fb8">
<title>英語ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* TOEICの問題冊子に、書き込み用の罫線を足したノート */
:root{
  --paper:#f6f7f9; --sheet:#ffffff; --ink:#18202e; --muted:#5d6676; --line:#d9dde5;
  --mark:#1f4fb8; --mark-soft:#e6edfb; --ok:#1d7a4c; --ok-soft:#e3f3ea; --ng:#b4322a; --ng-soft:#fbe7e5; --warn:#a46200; --warn-soft:#fbf0dc;
  --f-text:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-ui:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  --f-num:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151c; --sheet:#181d26; --ink:#e6e9ef; --muted:#9aa3b2; --line:#2c3341;
  --mark:#7ea2ff; --mark-soft:#1e2a45; --ok:#5cc58f; --ok-soft:#173326; --ng:#ff8a80; --ng-soft:#3a1d1b; --warn:#f0b35a; --warn-soft:#3a2c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11151c; --sheet:#181d26; --ink:#e6e9ef; --muted:#9aa3b2; --line:#2c3341;
  --mark:#7ea2ff; --mark-soft:#1e2a45; --ok:#5cc58f; --ok-soft:#173326; --ng:#ff8a80; --ng-soft:#3a1d1b; --warn:#f0b35a; --warn-soft:#3a2c14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 72px;display:grid;gap:24px}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0}
p{margin:0}
a{color:var(--mark)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--mark);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:6px;padding:8px 16px;font-weight:500}
.btn.primary{background:var(--mark);border-color:var(--mark);color:var(--sheet)}
.btn.ghost{background:transparent}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}
.lead{color:var(--muted);max-width:62ch}
.tag{border:1px solid var(--line);border-radius:999px;padding:0 8px;font-size:12px;color:var(--muted);white-space:nowrap}
.saved{font-size:12px;color:var(--muted)}
.saved.ok{color:var(--ok)}
.saved.ng{color:var(--warn)}

.review{background:var(--sheet);border:1px solid var(--mark);border-radius:8px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between}
.review b{font-size:16px}

/* 単元一覧 */
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.how div{background:var(--sheet);padding:12px 14px;display:grid;gap:2px;align-content:start}
.how b{font-size:14px}
.how span{font-size:13px;color:var(--muted)}
.units{display:grid;border-top:1px solid var(--line)}
.unit{display:grid;grid-template-columns:3.2em minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none}
.unit:hover{background:var(--mark-soft)}
.unit .no{font-family:var(--f-num);color:var(--muted);font-size:13px}
.unit .t{font-weight:700}
.unit .p{grid-column:2;font-size:13px;color:var(--muted)}
.unit .meta{grid-row:1/3;grid-column:3;display:grid;justify-items:end;gap:4px;font-size:12px;color:var(--muted)}

/* 出題 */
.top{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap}
.top .spacer{flex:1}
.top h1{font-size:20px}
.track{height:6px;background:var(--sheet);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--mark);transition:width .2s}
details.point{background:var(--sheet);border:1px solid var(--line);border-radius:6px;padding:8px 14px}
details.point summary{cursor:pointer;color:var(--mark);font-size:13px}
details.point p{margin-top:6px;font-size:14px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:22px 22px 20px;display:grid;gap:14px}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.qhead .spacer{flex:1}
.kind{font-weight:700;color:var(--ink);letter-spacing:.06em}
.clock{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.clock.over{color:var(--warn)}
.ja{font-size:18px;font-weight:500}
.gloss{font-size:14px;color:var(--muted)}
.en{font-family:var(--f-text);font-size:21px;line-height:1.9;overflow-wrap:anywhere}
.en input{font-family:var(--f-text);font-size:20px;border:0;border-bottom:2px solid var(--ink);background:var(--mark-soft);color:var(--ink);padding:0 6px;width:8.5em;max-width:100%;border-radius:3px 3px 0 0}
.en .base{font-family:var(--f-ui);font-size:14px;color:var(--muted);margin-left:4px;white-space:nowrap}
.en .gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 4px}
.hint{font-size:13px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:500}
.line{width:100%;font-family:var(--f-text);font-size:19px;border:0;border-bottom:2px solid var(--ink);background:var(--mark-soft);color:var(--ink);padding:8px;border-radius:3px 3px 0 0}
.built{min-height:56px;border-bottom:2px solid var(--ink);background:var(--mark-soft);border-radius:3px 3px 0 0;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.built:empty::before{content:"下の語を順にタップ";color:var(--muted);font-size:13px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-text);font-size:18px;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:4px 12px}
.chip.used{visibility:hidden}
.built .chip{background:var(--sheet)}
.ops{display:flex;gap:8px;flex-wrap:wrap}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:8px 12px;font-family:var(--f-text);font-size:18px}
.opt:hover{border-color:var(--mark)}
.opt .l{font-family:var(--f-num);font-size:13px;color:var(--muted);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--ng);background:var(--ng-soft);text-decoration:line-through}
.opt:disabled{cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.actions .spacer{flex:1}
.kbd{font-size:12px;color:var(--muted)}
.fb{border-radius:6px;padding:12px 14px;display:grid;gap:6px}
.fb.ok{background:var(--ok-soft)}
.fb.ng{background:var(--ng-soft)}
.fb .v{font-weight:700}
.fb.ok .v{color:var(--ok)}
.fb.ng .v{color:var(--ng)}
.fb .ans{font-family:var(--f-text);font-size:18px}
.fb .alt{font-size:13px;color:var(--muted)}
.fb .ex{font-size:14px}
.fb .self{justify-self:start;font-size:13px;padding:4px 12px}

/* 結果 */
.score{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap}
.score .big{font-family:var(--f-num);font-size:40px;font-weight:500}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.split div{background:var(--sheet);padding:10px 14px;display:grid}
.split b{font-size:12px;color:var(--muted);font-weight:500}
.split span{font-family:var(--f-num);font-size:18px}
.miss{display:grid;gap:10px}
.miss .m{background:var(--sheet);border:1px solid var(--line);border-left:4px solid var(--ng);border-radius:4px;padding:10px 14px;display:grid;gap:4px}
.miss .m .q{font-size:15px}
.miss .m .q .e{font-family:var(--f-text)}
.miss .m .you{font-family:var(--f-text);color:var(--ng)}
.miss .m .right{font-family:var(--f-text);color:var(--ok)}
.miss .m .ex{font-size:13px;color:var(--muted)}
.copybox{display:grid;gap:10px;background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:14px}
.copybox textarea{width:100%;min-height:110px;font-family:var(--f-num);font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:8px}
@media (max-width:560px){
  .card{padding:18px 16px}
  .en{font-size:19px}
  .unit{grid-template-columns:2.6em minmax(0,1fr)}
  .unit .meta{grid-row:auto;grid-column:2;justify-items:start;display:flex;gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* 単語・文法の切り替え */
.modes{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--sheet)}
.mode{border:0;background:transparent;color:var(--muted);padding:10px 0;font-weight:700;font-size:16px}
.mode.on{background:var(--mark);color:var(--sheet)}
.mode+.mode{border-left:1px solid var(--line)}

/* 記録の同期 */
.sync{background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:10px 16px}
.sync summary{cursor:pointer;font-size:14px;font-weight:500}
.syncbody{display:grid;gap:10px;margin-top:10px;font-size:14px}
.syncbody ol{margin:0;padding-left:1.4em;display:grid;gap:4px;color:var(--muted)}
.syncbody ol b,.syncbody p b{color:var(--ink)}
.tokrow{display:flex;gap:8px;flex-wrap:wrap}
.tokrow input{flex:1 1 220px;min-width:0;font-family:var(--f-num);font-size:16px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--paper);color:var(--ink)}

/* 単語カード */
.cardword{font-family:var(--f-text);font-size:44px;font-weight:600;text-align:center;padding:28px 0 20px;overflow-wrap:anywhere}
.cardback{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:14px}
.cardback .mean{font-size:22px;font-weight:700}
.cardback .en{font-size:19px}
.hl{color:var(--mark);font-weight:600}
.btn.wide{flex:1 1 140px;padding:12px 16px;font-size:16px}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.btn.ng{background:var(--sheet);border-color:var(--ng);color:var(--ng)}
.cardback[hidden]{display:none}
.units .sec{font-size:13px;letter-spacing:.12em;color:var(--muted);padding:18px 4px 6px;border-bottom:1px solid var(--line);margin:0}
body{margin:0}
</style>
</head>

const sorted = o => Object.fromEntries(Object.keys(o).sort().map(k => [k, o[k]]));

/* 復習の予定（問題ごとに1件）。まず端末の控えで動き、GitHubの記録が読めたら差し替える */
const SRS = {map: {}, state: "loading"};
const SYNC = {state: "idle"};
async function loadSrs() {
  SRS.map = LS.get("srs", {});
  SRS.state = "ready";
  if (!token()) { SYNC.state = "off"; return; }
  try {
    const files = await withTimeout(readRemote(), 12000);
    const remote = {};
    Object.values(files).forEach(f => Object.assign(remote, f.map));
    SRS.map = Object.assign(remote, LS.get("pendSrs", {}));
    Object.keys(SRS.map).forEach(k => { if (!SRS.map[k]) delete SRS.map[k]; });
    LS.set("srs", SRS.map);
    SYNC.state = "ok";
    if (Object.keys(LS.get("pendSrs", {})).length || LS.get("pendAtt", []).length) flush().catch(() => {});
  } catch (e) { SYNC.state = "error"; }
}
function srsWrite(qid) {
  const pend = LS.get("pendSrs", {});
  pend[qid] = SRS.map[qid] || null;
  LS.set("pendSrs", pend);
  LS.set("srs", SRS.map);
}
let flushing = null;
function flush() {
  if (!flushing) flushing = doFlush().finally(() => { flushing = null; });
  return flushing;
}
async function doFlush() {
  if (!token()) return "off";
  for (let round = 0; round < 3; round++) {
    const pend = LS.get("pendSrs", {});
    const byFile = {};
    Object.keys(pend).forEach(id => { (byFile[fileOf(id)] = byFile[fileOf(id)] || []).push(id); });
    let conflict = false;
    if (Object.keys(byFile).length) {
      const files = await readRemote();
      for (const [f, ids] of Object.entries(byFile)) {
        const cur = files[f] ? files[f].map : {};
        ids.forEach(id => { if (pend[id]) cur[id] = pend[id]; else delete cur[id]; });
        const body = {message: `復習の予定 ${f} ${today()}`, content: b64(JSON.stringify(sorted(cur)))};
        if (files[f]) body.sha = files[f].sha;
        const r = await gh("contents/srs/" + f, {method: "PUT", body: JSON.stringify(body)});
        if (r.status === 409 || r.status === 422) { conflict = true; break; }
        if (!r.ok) throw new Error("put " + r.status);
        const now = LS.get("pendSrs", {});
        ids.forEach(id => { if (JSON.stringify(now[id]) === JSON.stringify(pend[id])) delete now[id]; });
        LS.set("pendSrs", now);
      }
    }
    if (conflict) continue;
    for (const a of LS.get("pendAtt", [])) {
      const r = await gh("contents/attempts/" + a.file, {method: "PUT", body: JSON.stringify({message: `記録 ${a.file}`, content: b64(JSON.stringify(a.rec, null, 1))})});
      if (!r.ok && r.status !== 422) throw new Error("attempt " + r.status);
      LS.set("pendAtt", LS.get("pendAtt", []).filter(x => x.file !== a.file));
    }
    SYNC.state = "ok";
    return "ok";
  }
  throw new Error("conflict");
}
window.addEventListener("online", () => { if (token()) flush().catch(() => {}); });

/* 正解なら次の間隔へ進め、間違えたら翌日からやり直す。同じ日の2回目以降は予定を動かさない */
function srsRecord(qid, ok, kind) {
  const t = today(), cur = SRS.map[qid];
  if (cur && cur.last === t) return false;
  const stage = cur ? cur.stage : 0;
  const due = addDays(t, ok ? (stage < IVL.length ? IVL[stage] : MATURE) : 1);
  const isRev = kind === "review";
  SRS.map[qid] = {
    id: qid, unit: QBY[qid] ? QBY[qid].u.id : "", stage: ok ? Math.min(stage + 1, IVL.length) : 0, due, last: t,
    first: cur ? cur.first : t,
    reviews: (cur ? cur.reviews : 0) + (isRev ? 1 : 0),
    remembered: (cur ? cur.remembered : 0) + (isRev && ok ? 1 : 0),
    forgot: (cur ? cur.forgot : 0) + (isRev && !ok ? 1 : 0),
    hist: (cur && cur.hist ? cur.hist.slice(-19) : []).concat([{d: t, ok, k: isRev ? "review" : "learn"}])
  };
  srsWrite(qid);
  return true;
}
function dueList(d) {
  const t = today();
  return Object.values(SRS.map).filter(x => x.due <= t && QBY[x.id] && QBY[x.id].u.d === d).sort((a, b) => a.due < b.due ? -1 : a.due > b.due ? 1 : a.id < b.id ? -1 : 1);
}

function norm(s) {
  s = String(s).normalize("NFKC").toLowerCase().replace(/[’‘`]/g, "'").replace(/　/g, " ");
  s = s.replace(/\be-mail/g, "email");
  s = s.replace(/[.,!?;:"]/g, " ").replace(/\s+/g, " ").trim();
  s = s.replace(/\bcan't\b/g, "cannot").replace(/\bcan not\b/g, "cannot").replace(/\bwon't\b/g, "will not")
       .replace(/n't\b/g, " not").replace(/\bi'm\b/g, "i am").replace(/'re\b/g, " are")
       .replace(/'ve\b/g, " have").replace(/'ll\b/g, " will")
       .replace(/\b(do|does|did|is|are|was|were|have|has|could|should|would)nt\b/g, "$1 not").replace(/\bcant\b/g, "cannot");
  s = s.replace(/\b(\d{1,2})\b/g, (m, d) => NUM[+d] || m);
  return s.replace(/\s+/g, " ").trim();
}
function variants(s) {
  const n = norm(s), re = /\b(he|she|it|that|there|what|where|who|here|how)'s\b/g;
  if (!re.test(n)) return [n];
  return [n.replace(re, "$1 is"), n.replace(re, "$1 has")];
}
function isRight(given, answers) {
  const ok = new Set(answers.flatMap(variants));
  return variants(given).some(v => ok.has(v));
}
function answerText(q) { return q.t === "choice" ? q.ch[q.ans] : q.t === "card" ? q.mean : q.a[0]; }
const hl = s => esc(s).replace(/\[(.+?)\]/g, '<b class="hl">$1</b>');
const plain = s => String(s).replace(/[\[\]]/g, "");
function enHtml(en, inner) {
  const [a, b] = en.split(BLANK);
  return `${esc(a)}${inner}${esc(b)}`;
}
function shuffle(a) {
  const b = a.slice();
  for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}
function chipText(w, i) { return i === 0 && !PROPER.has(w) ? w.charAt(0).toLowerCase() + w.slice(1) : w; }
function orderTokens(q) {
  return q.a[0].replace(/[.?!]$/, "").split(" ").map(chipText).concat(q.extra);
}

    return;
  }
  document.getElementById("check").onclick = () => check(false);
  document.getElementById("give").onclick = () => check(true);
  if (q.t === "order") {
    document.getElementById("pool").onclick = e => {
      const b = e.target.closest(".chip"); if (!b || S.phase !== "answer" || b.classList.contains("used")) return;
      S.built.push(+b.dataset.k); drawBuilt();
    };
    document.getElementById("built").onclick = e => {
      const b = e.target.closest(".chip"); if (!b || S.phase !== "answer") return;
      S.built.splice(+b.dataset.pos, 1); drawBuilt();
    };
    document.getElementById("undo").onclick = () => { if (S.phase === "answer") { S.built.pop(); drawBuilt(); } };
    document.getElementById("clear").onclick = () => { if (S.phase === "answer") { S.built = []; drawBuilt(); } };
  } else {
    try { document.getElementById("ans").focus({preventScroll: true}); } catch (e) {}
  }
}

function drawBuilt() {
  const used = new Set(S.built);
  document.querySelectorAll("#pool .chip").forEach(b => b.classList.toggle("used", used.has(+b.dataset.k)));
  document.getElementById("built").innerHTML = S.built.map((k, p) => `<button class="chip" data-pos="${p}">${esc(S.pool[k].t)}</button>`).join("");
}

function given() {
  if (S.q.t === "order") return S.built.map(k => S.pool[k].t).join(" ");
  return document.getElementById("ans").value;
}

function check(gaveUp, pick) {
  if (S.phase !== "answer") return;
  const q = S.q;
  let g, ok;
  if (q.t === "choice") {
    clearInterval(tick);
    const orig = S.perm[pick];
    g = q.ch[orig]; ok = orig === q.ans;
    document.querySelectorAll("#opts .opt").forEach(b => {
      const k = +b.dataset.k, o = S.perm[k]; b.disabled = true;
      if (o === q.ans) b.classList.add("right"); else if (k === pick) b.classList.add("wrong");
    });
  } else {
    g = given();
    if (!gaveUp && !g.trim()) { const el = document.getElementById("ans"); if (el) el.focus(); return; }
    ok = !gaveUp && isRight(g, q.a);
    const inp = document.getElementById("ans"); if (inp) inp.readOnly = true;
  }
  const secs = Math.round((Date.now() - S.qStart) / 1000);
  const prev = SRS.map[q.id] ? Object.assign({}, SRS.map[q.id]) : null;
  const counted = S.mode !== "retry" && SRS.state === "ready" ? srsRecord(q.id, ok, S.mode) : false;
  S.res[S.pos] = {ok, given: gaveUp ? "" : g, self: false, secs, counted, prev};
  S.phase = "checked";
  const fb = document.getElementById("fb");
  const others = q.t === "choice" ? [] : q.a.slice(1);
  const nextLine = counted ? `<span class="alt">次の復習：${md(SRS.map[q.id].due)}</span>` : "";
  fb.innerHTML = `<div class="fb ${ok ? "ok" : "ng"}">
      <span class="v">${ok ? (S.mode === "review" ? "正解（覚えていた）" : "正解") : gaveUp ? "答え" : (S.mode === "review" ? "ちがいます（忘れていた）" : "ちがいます")}${q.t === "choice" ? `<span class="num" style="font-weight:400;margin-left:10px;font-size:13px">${secs}秒</span>` : ""}</span>
      ${!ok && q.t !== "choice" ? `<span class="ans">${esc(q.a[0])}</span>` : ""}
      ${others.length && q.t === "write" ? `<span class="alt">ほかの正解：${others.map(esc).join(" ／ ")}</span>` : ""}
      ${!ok && q.t === "form" && others.length ? `<span class="alt">${others.map(esc).join("・")} でも正解</span>` : ""}
      ${q.t === "choice" ? `<span class="alt">訳：${esc(q.ja)}</span>` : ""}
      <span class="ex">${esc(q.ex)}</span>
      <span id="nextdue">${nextLine}</span>
      ${!ok && !gaveUp && q.t === "write" ? `<button class="btn self" id="self">書き方が違うだけで合っていた</button>` : ""}
    </div>`;
  const self = document.getElementById("self");
  if (self) self.onclick = () => {
    const r = S.res[S.pos];
    r.ok = true; r.self = true;
    if (r.counted) {
      if (r.prev) SRS.map[q.id] = r.prev; else delete SRS.map[q.id];
      srsRecord(q.id, true, S.mode);
      document.getElementById("nextdue").innerHTML = `<span class="alt">次の復習：${md(SRS.map[q.id].due)}</span>`;
    }
    self.replaceWith(Object.assign(document.createElement("span"), {className: "alt", textContent: "正解に直しました"}));
  };
  const last = S.pos === S.list.length - 1;
  document.getElementById("acts").innerHTML = `<button class="btn primary" id="next">${last ? "結果を見る" : "次へ"}</button><span class="spacer"></span><span class="kbd">Enterで次へ</span>`;
  const nx = document.getElementById("next");
  nx.onclick = next;
  try { nx.focus({preventScroll: true}); } catch (e) {}
  fb.scrollIntoView({block: "nearest"});
}

/* 単語カード：意味を見る → 思い出せたかを自分で選ぶ */
function reveal() {
  if (!S || S.phase !== "answer" || S.q.t !== "card") return;
  S.phase = "shown";
  document.getElementById("cback").hidden = false;
  document.getElementById("acts").innerHTML = `<button class="btn ok wide" id="yes">思い出せた</button><button class="btn ng wide" id="no">思い出せなかった</button>`;
  document.getElementById("yes").onclick = () => grade(true);
  document.getElementById("no").onclick = () => grade(false);
}
function grade(ok) {
  if (!S || S.phase !== "shown") return;
  const q = S.q;
  const secs = Math.round((Date.now() - S.qStart) / 1000);
  const prev = SRS.map[q.id] ? Object.assign({}, SRS.map[q.id]) : null;
  const counted = S.mode !== "retry" && SRS.state === "ready" ? srsRecord(q.id, ok, S.mode) : false;
  S.res[S.pos] = {ok, given: ok ? "" : "思い出せなかった", self: false, secs, counted, prev};
  S.phase = "checked";
  document.getElementById("fb").innerHTML = `<div class="fb ${ok ? "ok" : "ng"}"><span class="v">${ok ? "思い出せた" : "思い出せなかった"}</span>${counted ? `<span class="alt">次の復習：${md(SRS.map[q.id].due)}</span>` : ""}</div>`;
  const last = S.pos === S.list.length - 1;
  document.getElementById("acts").innerHTML = `<button class="btn primary wide" id="next">${last ? "結果を見る" : "次へ"}</button>`;
  document.getElementById("next").onclick = next;
}

function next() {
  if (S.pos < S.list.length - 1) { S.pos++; renderQ(); window.scrollTo(0, 0); }
  else result();
}

document.addEventListener("keydown", e => {
  if (!S || S.phase === "result" || e.isComposing) return;
  if (S.q && S.q.t === "choice" && S.phase === "answer" && /^[abcd]$/i.test(e.key) && !e.metaKey && !e.ctrlKey) {
    e.preventDefault(); check(false, "abcd".indexOf(e.key.toLowerCase())); return;
  }
  if (S.q && S.q.t === "card" && !e.metaKey && !e.ctrlKey) {
    if (S.phase === "answer" && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); reveal(); return; }
    if (S.phase === "shown" && (e.key === "1" || e.key === "2")) { e.preventDefault(); grade(e.key === "1"); return; }
    if (S.phase === "shown") return;
  }
  if (e.key !== "Enter") return;
  if (e.target.tagName === "BUTTON" || e.target.tagName === "A" || e.target.tagName === "TEXTAREA") return;
  e.preventDefault();
  if (S.phase === "answer") { if (S.q.t !== "choice") check(false); } else next();
});

async function save(rec, el) {
  const file = `${rec.at.replace(/[:.]/g, "-")}_${rec.drill}.json`;
  const stored = LS.set("pendAtt", LS.get("pendAtt", []).concat([{file, rec}]));
  if (!token()) {
    el.className = "saved ng";
    el.textContent = stored ? "この端末にだけ保存しました。ホームの「記録の同期」を設定すると、TOEIC対策部門にも届きます。" : "保存できませんでした。下の結果をコピーしてチャットに貼ってください。";
    return;
  }
  try {
    await withTimeout(flush(), 25000);
    el.className = "saved ok"; el.textContent = "結果と復習の予定を保存しました。TOEIC対策部門が日付つきで読めます。";
  } catch (e) {
    el.className = "saved ng"; el.textContent = "通信できなかったので、この端末に預けました。次にこのページを開いたときに自動で送ります。";
  }
}

function result() {
  clearInterval(tick);
  S.phase = "result";
  const {list, res, mode} = S;
  const r = p => res[p] || {ok: false, given: "", self: false, secs: 0};
  const qAt = p => list[p].u.qs[list[p].qi];
  const pos = list.map((_, p) => p);
  const okN = pos.filter(p => r(p).ok).length;
  const wrong = pos.filter(p => !r(p).ok);
  const byKind = {};
  pos.forEach(p => { const t = qAt(p).t; byKind[t] = byKind[t] || [0, 0]; byKind[t][1]++; if (r(p).ok) byKind[t][0]++; });
  const ch = pos.filter(p => qAt(p).t === "choice");
  const avg = ch.length ? Math.round(ch.reduce((s, p) => s + r(p).secs, 0) / ch.length) : null;
  const now = new Date();
  const local = `${localDate(now)} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const isRev = mode === "review";
  const no = S.unit ? pad(DATA.filter(u => u.d === S.drill).indexOf(S.unit) + 1) : "--";
  const head = isRev ? `${NAME[S.drill]} 今日の復習` : `${NAME[S.drill]} ${no} ${S.title}${mode === "retry" ? "（間違えた問題のみ）" : ""}`;
  const lines = [`${head} ${local}`, (isRev ? `覚えていた ${okN}/${list.length}` : `正解 ${okN}/${list.length}`) + (avg !== null ? `／本番形式の平均 ${avg}秒` : "")];
  if (wrong.length) {
    lines.push(isRev ? "忘れていた問題:" : "間違えた問題:");
    wrong.forEach(p => { const q = qAt(p); if (q.t === "card") { lines.push(`- ${q.id} ${q.word}（${q.mean}）`); return; } lines.push(`- ${q.id} [${kindName(q.t, S.drill)}] ${q.en || q.ja} ／ 答え: ${r(p).given || "（答えを見た）"} ／ 正解: ${answerText(q)}`); });
  }
  const remain = isRev ? dueList(S.drill).length : 0;
  app.innerHTML = `
    <div class="top"><a href="#" id="back">← 一覧</a></div>
    <div style="display:grid;gap:6px">
      <div class="eyebrow">${esc(S.lv)}${S.unit ? ` · ${no}` : ""}</div>
      <h1 style="font-size:26px">${esc(S.title)}</h1>
    </div>
    <div class="score"><span class="big">${okN} / ${list.length}</span><span style="color:var(--muted)">${isRev ? `覚えていた ${okN}問・忘れていた ${wrong.length}問です。忘れていた問題は明日もう一度出ます。` : wrong.length ? `間違えた問題は ${wrong.length}問です。` : "全問正解です。"}</span></div>
    <div class="split">${Object.keys(KIND).filter(t => byKind[t]).map(t => `<div><b>${kindName(t, S.drill)}</b><span>${byKind[t][0]} / ${byKind[t][1]}</span></div>`).join("")}
      ${avg !== null ? `<div><b>本番形式の平均</b><span>${avg}秒</span></div>` : ""}</div>
    <p class="saved" id="saved">結果を保存しています…</p>
    <div class="actions">
      ${remain ? `<a class="btn primary" href="#review" id="more" style="text-decoration:none">残りの復習 ${remain}問へ</a>` : ""}
      ${wrong.length ? `<button class="btn ${remain ? "" : "primary"}" id="retry">${isRev ? "忘れていた" : "間違えた"} ${wrong.length}問だけもう一度</button>` : ""}
      ${S.unit && mode === "learn" ? `<button class="btn" id="again">最初からもう一度</button>` : ""}
    </div>
    ${wrong.length && SRS.state === "ready" && mode !== "retry" ? `<p class="saved">もう一度解いても、復習の予定は変わりません（その日の最初の1回で決まります）。</p>` : ""}
    ${wrong.length ? `<section class="miss"><h2 style="font-size:17px">${S.drill === "vocab" ? "思い出せなかった語" : isRev ? "忘れていた問題" : "間違えた問題"}</h2>${wrong.map(p => { const q = qAt(p); return q.t === "card" ? `
      <div class="m"><span class="q"><span class="e" style="font-size:18px">${esc(q.word)}</span>　${esc(q.mean)}</span>
        <span class="ex">${hl(q.en)}　${esc(q.ja)}</span></div>` : `
      <div class="m"><span class="q">${q.en ? `<span class="e">${esc(q.en)}</span>　` : ""}<span style="color:var(--muted);font-size:13px">${esc(q.ja)}</span></span>
        <span class="you">あなたの答え：${esc(r(p).given || "（答えを見た）")}</span>
        <span class="right">正解：${esc(answerText(q))}</span>
        <span class="ex">${esc(q.ex)}</span></div>`; }).join("")}</section>` : ""}
    <section class="copybox">
      <b style="font-size:14px">自動保存ができなかったときは、この結果をチャットに貼ってください</b>
      <textarea id="out" readonly aria-label="結果のテキスト">${esc(lines.join("\n"))}</textarea>
      <div class="actions"><button class="btn" id="copy">結果をコピー</button><span id="copied" class="kbd"></span></div>
    </section>`;
  const prevS = S;
  document.getElementById("back").onclick = e => { e.preventDefault(); location.hash = ""; home(); };
  const ag = document.getElementById("again"); if (ag) ag.onclick = () => { startUnit(prevS.unit); window.scrollTo(0, 0); };
  const mo = document.getElementById("more"); if (mo) mo.onclick = e => { e.preventDefault(); if (location.hash === "#review") startReview(); else location.hash = "review"; window.scrollTo(0, 0); };
  const rt = document.getElementById("retry"); if (rt) rt.onclick = () => { startRetry(prevS, wrong.map(p => list[p])); window.scrollTo(0, 0); };
  document.getElementById("copy").onclick = () => {
    const ta = document.getElementById("out"), msg = document.getElementById("copied");
    const fallback = () => { ta.focus(); ta.select(); msg.textContent = "選択しました。コピーしてください"; };
    try { navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = "コピーしました"; }, fallback); } catch (e) { fallback(); }
  };
  window.scrollTo(0, 0);
  save({
    v: 3, drill: DRILL[S.drill], unit: S.unit ? S.unit.id : "review", unitNo: no, title: S.title,
    scope: mode === "learn" ? "all" : mode, at: now.toISOString(), local,
    correct: okN, total: list.length, totalSecs: Math.round((Date.now() - S.started) / 1000),
    byKind: Object.fromEntries(Object.entries(byKind).map(([k, v]) => [k, {correct: v[0], total: v[1]}])),
    choiceAvgSecs: avg,
    items: pos.map(p => { const q = qAt(p), x = r(p); return {id: q.id, t: q.t, ok: x.ok, self: x.self, secs: x.secs, srs: !!x.counted, ...(x.ok ? {} : {given: x.given})}; })
  }, document.getElementById("saved"));
}

route();
loadSrs().then(() => {
  if (location.hash === "#review" && (!S || S.mode !== "review")) route();
  else if (!S) home();
});
</script>
</body>
</html>
